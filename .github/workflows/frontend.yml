name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify required files
        run: |
          test -f index.html
          test -f 404.html
          test -f css/style.css
          test -f js/theme-toggle.js
          test -f js/visitor-counter.js
          test -f .well-known/security.txt
          test -f .well-known/pgp-key.txt
          test -f robots.txt
          test -f sitemap.xml
          test -f assets/og-card.png

      - name: Verify published OpenPGP encryption key
        run: |
          key_metadata=$(gpg --batch --with-colons --import-options show-only --import .well-known/pgp-key.txt)
          primary_fingerprint=$(printf '%s\n' "$key_metadata" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$primary_fingerprint" = "BC0A79687E6739099C01A99B5358B878D8052940"
          printf '%s\n' "$key_metadata" | awk -F: '$1 == "sub" && index($12, "e") { found = 1 } END { exit !found }'

      - name: Verify signed security contact
        run: |
          verification_home=$(mktemp -d)
          signed_payload=$(mktemp)
          expected_payload=$(mktemp)

          cleanup() {
            rm -rf "$verification_home" "$signed_payload" "$expected_payload"
          }

          trap cleanup EXIT

          gpg --batch --homedir "$verification_home" --import .well-known/pgp-key.txt >/dev/null 2>&1
          gpg --batch --homedir "$verification_home" --status-fd 1 --verify .well-known/security.txt 2>/dev/null | \
            awk '$2 == "VALIDSIG" { print $3; exit }' | \
            grep --fixed-strings --quiet 'BC0A79687E6739099C01A99B5358B878D8052940'
          awk '
            /^-----BEGIN PGP SIGNED MESSAGE-----$/ { message_started = 1; next }
            message_started && /^$/ { cleartext_started = 1; next }
            cleartext_started && /^-----BEGIN PGP SIGNATURE-----$/ { exit }
            cleartext_started { print }
          ' .well-known/security.txt > "$signed_payload"

          cat > "$expected_payload" <<'EOF'
          Contact: mailto:perinzaum@proton.me
          Encryption: https://resume.perinzaum.space/.well-known/pgp-key.txt
          Expires: 2027-06-30T23:59:59Z
          Preferred-Languages: en, pt-BR
          Canonical: https://resume.perinzaum.space/.well-known/security.txt
          EOF

          cmp "$expected_payload" "$signed_payload"

      - name: Verify crawl-discovery documents
        run: |
          grep --fixed-strings --quiet 'User-agent: *' robots.txt
          grep --fixed-strings --quiet 'Allow: /' robots.txt
          grep --fixed-strings --quiet 'Disallow: /cdn-cgi/' robots.txt
          grep --fixed-strings --quiet 'Sitemap: https://resume.perinzaum.space/sitemap.xml' robots.txt
          grep --fixed-strings --quiet '<loc>https://resume.perinzaum.space/</loc>' sitemap.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ElementTree

          namespace = {'sitemap': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ElementTree.parse('sitemap.xml').getroot()
          locations = [element.text for element in root.findall('sitemap:url/sitemap:loc', namespace)]
          assert locations == ['https://resume.perinzaum.space/'], locations
          PY

      - name: Verify social-card dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          with Path('assets/og-card.png').open('rb') as image:
              assert image.read(8) == b'\x89PNG\r\n\x1a\n'
              assert image.read(4) == struct.pack('>I', 13)
              assert image.read(4) == b'IHDR'
              width, height = struct.unpack('>II', image.read(8))

          assert (width, height) == (1200, 630), (width, height)
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check js/theme-toggle.js
          node --check js/visitor-counter.js

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp 404.html _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp -R css _site/
          cp -R js _site/

          if [ -d assets ]; then
            cp -R assets _site/
          fi

          if [ -d .well-known ]; then
            cp -R .well-known _site/
          fi

      - name: Smoke test locally
        shell: bash
        run: |
          python3 -m http.server 8000 \
            --directory _site \
            >/tmp/frontend-server.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" || true
          }

          trap cleanup EXIT
          sleep 1

          curl --fail --silent --show-error http://localhost:8000/
          curl --fail --silent --show-error http://localhost:8000/404.html
          curl --fail --silent --show-error http://localhost:8000/robots.txt
          curl --fail --silent --show-error http://localhost:8000/sitemap.xml
          curl --fail --silent --show-error http://localhost:8000/css/style.css
          curl --fail --silent --show-error http://localhost:8000/js/theme-toggle.js
          curl --fail --silent --show-error http://localhost:8000/js/visitor-counter.js
          curl --fail --silent --show-error http://localhost:8000/.well-known/security.txt
          curl --fail --silent --show-error http://localhost:8000/.well-known/pgp-key.txt | \
            gpg --batch --with-colons --import-options show-only --import
          curl --fail --silent --show-error http://localhost:8000/assets/og-card.png

  deploy:
    name: Deploy frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp 404.html _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp -R css _site/
          cp -R js _site/

          if [ -d assets ]; then
            cp -R assets _site/
          fi

          if [ -d .well-known ]; then
            cp -R .well-known _site/
          fi

      - name: Synchronize frontend to Azure Storage
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          az storage blob sync \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login \
            --source _site \
            --container '$web' \
            --delete-destination true

      - name: Set static-file response metadata
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          set_content_type() {
            az storage blob update \
              --account-name "$STORAGE_ACCOUNT" \
              --auth-mode login \
              --container-name '$web' \
              --name "$1" \
              --content-type "$2" \
              --only-show-errors \
              --output none
          }

          set_content_type .well-known/security.txt 'text/plain; charset=utf-8'
          set_content_type .well-known/pgp-key.txt 'text/plain; charset=utf-8'
          set_content_type robots.txt 'text/plain; charset=utf-8'
          set_content_type sitemap.xml 'application/xml; charset=utf-8'

          for blob_name in index.html 404.html; do
            az storage blob update \
              --account-name "$STORAGE_ACCOUNT" \
              --auth-mode login \
              --container-name '$web' \
              --name "$blob_name" \
              --content-type 'text/html; charset=utf-8' \
              --content-cache-control 'no-transform' \
              --only-show-errors \
              --output none
          done

      - name: Purge deployed files from Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        shell: bash
        run: |
          python3 - <<'PY' > purge.json
          import json
          import os
          from pathlib import Path

          base_url = os.environ['PUBLIC_SITE_URL'].rstrip('/')
          urls = [f'{base_url}/']

          for path in Path('_site').rglob('*'):
              if path.is_file():
                  relative = path.relative_to('_site').as_posix()
                  urls.append(f'{base_url}/{relative}')

          print(json.dumps({'files': urls}))
          PY

          curl \
            --fail-with-body \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data @purge.json

      - name: Smoke test public website
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --user-agent 'Mozilla/5.0 (compatible; CloudResumeDeploymentCheck/1.0)' \
            --retry 5 \
            --retry-delay 5 \
            "${PUBLIC_SITE_URL}/"

          curl \
            --fail \
            --silent \
            --show-error \
            --user-agent 'Mozilla/5.0 (compatible; CloudResumeDeploymentCheck/1.0)' \
            --retry 5 \
            --retry-delay 5 \
            "${PUBLIC_SITE_URL}/js/visitor-counter.js"

          for page_path in / /404.html; do
            html_headers=$(mktemp)
            curl \
              --fail \
              --silent \
              --show-error \
              --user-agent 'Mozilla/5.0 (compatible; CloudResumeDeploymentCheck/1.0)' \
              --retry 5 \
              --retry-delay 5 \
              --dump-header "$html_headers" \
              --output /dev/null \
              "${PUBLIC_SITE_URL}${page_path}"
            grep --ignore-case --quiet '^cache-control: no-transform' "$html_headers"
          done

          robots_headers=$(mktemp)
          curl \
            --fail \
            --silent \
            --show-error \
            --user-agent 'Mozilla/5.0 (compatible; CloudResumeDeploymentCheck/1.0)' \
            --retry 5 \
            --retry-delay 5 \
            --dump-header "$robots_headers" \
            --output /dev/null \
            "${PUBLIC_SITE_URL}/robots.txt"
          grep --ignore-case --quiet '^content-type: text/plain' "$robots_headers"

          sitemap_headers=$(mktemp)
          curl \
            --fail \
            --silent \
            --show-error \
            --user-agent 'Mozilla/5.0 (compatible; CloudResumeDeploymentCheck/1.0)' \
            --retry 5 \
            --retry-delay 5 \
            --dump-header "$sitemap_headers" \
            --output /dev/null \
            "${PUBLIC_SITE_URL}/sitemap.xml"
          grep --ignore-case --quiet '^content-type: application/xml' "$sitemap_headers"

          security_txt_headers=$(mktemp)
          curl \
            --fail \
            --silent \
            --show-error \
            --user-agent 'Mozilla/5.0 (compatible; CloudResumeDeploymentCheck/1.0)' \
            --retry 5 \
            --retry-delay 5 \
            --dump-header "$security_txt_headers" \
            --output /dev/null \
            "${PUBLIC_SITE_URL}/.well-known/security.txt"
          grep --ignore-case --quiet '^content-type: text/plain; charset=utf-8' "$security_txt_headers"

          pgp_key_file=$(mktemp)
          curl \
            --fail \
            --silent \
            --show-error \
            --user-agent 'Mozilla/5.0 (compatible; CloudResumeDeploymentCheck/1.0)' \
            --retry 5 \
            --retry-delay 5 \
            --output "$pgp_key_file" \
            "${PUBLIC_SITE_URL}/.well-known/pgp-key.txt"
          gpg --batch --with-colons --import-options show-only --import "$pgp_key_file" | \
            awk -F: '$1 == "fpr" { print $10; exit }' | \
            grep --fixed-strings --quiet 'BC0A79687E6739099C01A99B5358B878D8052940'

          signed_security_file=$(mktemp)
          verification_home=$(mktemp -d)
          cleanup() {
            rm -rf "$pgp_key_file" "$signed_security_file" "$verification_home"
          }
          trap cleanup EXIT
          curl \
            --fail \
            --silent \
            --show-error \
            --user-agent 'Mozilla/5.0 (compatible; CloudResumeDeploymentCheck/1.0)' \
            --retry 5 \
            --retry-delay 5 \
            --output "$signed_security_file" \
            "${PUBLIC_SITE_URL}/.well-known/security.txt"
          gpg --batch --homedir "$verification_home" --import "$pgp_key_file" >/dev/null 2>&1
          gpg --batch --homedir "$verification_home" --status-fd 1 --verify "$signed_security_file" 2>/dev/null | \
            awk '$2 == "VALIDSIG" { print $3; exit }' | \
            grep --fixed-strings --quiet 'BC0A79687E6739099C01A99B5358B878D8052940'
